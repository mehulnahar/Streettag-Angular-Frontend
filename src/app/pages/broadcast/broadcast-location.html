<div class="dialog-container" style="width: 700px; max-height: 90vh; overflow-y: auto;">
    <div style="padding: 20px;">
        <!-- Header with close button -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; position: sticky; top: 0; background: white; z-index: 1000;">
            <h4 style="margin: 0; font-size: 20px;">Add/Edit Geo-Location</h4>
            <button mat-icon-button (click)="onNoClick()" style="margin: -8px -8px 0 0;">
                <mat-icon>close</mat-icon>
            </button>
        </div>

        <div class="location-input-container" style="display: flex; align-items: center; margin-bottom: 16px; gap: 16px;">
            <mat-form-field style="flex: 1;">
                <mat-label>Event Location</mat-label>
                <input matInput placeholder="Enter location" [(ngModel)]="location" name="location">
            </mat-form-field>
            <button mat-raised-button color="accent" (click)="setlocation()" style="height: 36px; min-width: 120px;">
                Set Location
            </button>
        </div>

        <div class="map-container" style="height: 320px; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; margin-bottom: 16px;">
            <google-map [center]="center" 
                       [zoom]="zoom" 
                       height="100%" 
                       width="100%"
                       (mapClick)="onMapClick($event)">
                <!-- Circle -->
                <map-circle
                    #circle
                    [center]="markerPosition"
                    [radius]="currentRadius"
                    [options]="circleOptions"
                    (radiusChange)="onRadiusChange($event)"
                    (centerChange)="onCenterChange($event)">
                </map-circle>
            </google-map>
        </div>

        <div class="location-info" style="background: #f5f5f5; padding: 16px; border-radius: 8px; margin-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; gap: 16px;">
                <div style="flex: 1; text-align: center;">
                    <strong style="display: block; margin-bottom: 6px; color: #666;">Latitude</strong>
                    <span>{{angForm.get('lat')?.value || 0}}</span>
                </div>
                <div style="flex: 1; text-align: center; border-left: 1px solid #ddd; border-right: 1px solid #ddd; padding: 0 16px;">
                    <strong style="display: block; margin-bottom: 6px; color: #666;">Longitude</strong>
                    <span>{{angForm.get('lng')?.value || 0}}</span>
                </div>
                <div style="flex: 1; text-align: center;">
                    <strong style="display: block; margin-bottom: 6px; color: #666;">Radius in meters</strong>
                    <mat-form-field style="width: 80px;">
                        <input matInput type="number" [ngModel]="currentRadius" (ngModelChange)="onRadiusInput($event)" min="1">
                    </mat-form-field>
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <button mat-raised-button color="primary" 
                    [disabled]="!angForm.valid || clicked" 
                    (click)="addlocation()"
                    style="width: 200px; height: 40px;">
                Set Geo-Location
            </button>
        </div>
    </div>
</div>
