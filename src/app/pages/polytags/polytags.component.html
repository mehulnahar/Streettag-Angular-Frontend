<app-content-header 
    [title]="'PolyTag Management'" 
    [icon]="'room'"
    [hideBreadcrumb]="true"
    [hasBgImage]="true" 
    [class]="'pb-3 pt-3'">
</app-content-header>

<mat-toolbar color="primary" fxLayout="row" fxLayoutAlign="space-between center">
    <div fxLayout="row" fxLayoutAlign="center center">
        <button mat-raised-button color="accent" class="mx-2" (click)="openAddMessageDialog()">
            Add PolyTag
        </button>
    </div>
</mat-toolbar>

<div fxLayout="column" class="p-2">
    <div class="p-2">
        <div fxLayout="column" class="mat-elevation-z8">
            <mat-form-field class="px-3 py-1">
                <input matInput (keyup)="applyFilter($event)" placeholder="Type to filter all columns">
            </mat-form-field>
        </div>

        <mat-table #table [dataSource]="dataSource" matSort class="mat-elevation-z8">
            <ng-container matColumnDef="serial_number">
                <mat-header-cell *matHeaderCellDef mat-sort-header>No.</mat-header-cell>
                <mat-cell *matCellDef="let element; let i = index">{{i + 1}}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="polytag_name">
                <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.polytag_name}}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="score">
                <mat-header-cell *matHeaderCellDef mat-sort-header>Score</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.score}}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="category">
                <mat-header-cell *matHeaderCellDef mat-sort-header>Category</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.category}}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="asset_name">
                <mat-header-cell *matHeaderCellDef mat-sort-header>Asset</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.asset_name}}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="edit">
                <mat-header-cell *matHeaderCellDef>Edit</mat-header-cell>
                <mat-cell *matCellDef="let element">
                    <button mat-icon-button color="primary" (click)="openEditDialog(element)">
                        <mat-icon>edit</mat-icon>
                    </button>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="delete">
                <mat-header-cell *matHeaderCellDef>Delete</mat-header-cell>
                <mat-cell *matCellDef="let element">
                    <button mat-icon-button color="warn" (click)="confirmDialog(element.id)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>

        <mat-paginator #paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
    </div>
</div>
