<h1 mat-dialog-title>Edit Polytag</h1>
<div mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="fill">
      <mat-label>Polytag Name</mat-label>
      <input matInput formControlName="polytag_name">
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Score</mat-label>
      <input matInput formControlName="score" type="number">
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions>
  <!-- <button mat-button (click)="onNoClick()">Cancel</button> -->
  <button mat-button (click)="onSubmit()" [disabled]="!form.valid">Update PolyTag</button>
</div>
