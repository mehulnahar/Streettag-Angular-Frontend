<h2 mat-dialog-title>Add Location</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Location Name</mat-label>
      <input matInput formControlName="location_name" required>
      <mat-error *ngIf="form.get('location_name')?.hasError('required')">
        Location name is required
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onNoClick()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid">Add</button>
  </mat-dialog-actions>
</form>
