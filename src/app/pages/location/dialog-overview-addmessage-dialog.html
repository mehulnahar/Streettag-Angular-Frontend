<!-- Add Location Dialog -->
<div class="dialog-container">
  <h2 mat-dialog-title>Add Location</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <mat-form-field appearance="fill" class="w-100" style="background: #f5f5f5;">
        <mat-label>Location Name</mat-label>
        <input matInput formControlName="location_name" required>
        <mat-error *ngIf="form.get('location_name')?.hasError('required')">
          Location name is required
        </mat-error>
      </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onNoClick()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid">Add</button>
    </mat-dialog-actions>
  </form>
</div>

<style>


mat-form-field {
  display: block;
  margin-bottom: 20px;
  width: 100%;
}

::ng-deep .mat-mdc-form-field {
  width: 100%;
}

::ng-deep .mat-mdc-dialog-container {
  border-radius: 0 !important;
}

::ng-deep .mat-mdc-dialog-surface {
  border-radius: 0 !important;
}

::ng-deep .mat-mdc-form-field-appearance-fill .mat-mdc-form-field-flex {
  background-color: #f5f5f5 !important;
  border-radius: 0 !important;
}

::ng-deep .mat-mdc-raised-button {
  border-radius: 0 !important;
}

::ng-deep .mat-mdc-button {
  border-radius: 0 !important;
}

mat-dialog-actions {
  padding: 16px 0;
  margin-bottom: 0;
}
</style>
