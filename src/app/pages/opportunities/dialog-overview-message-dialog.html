<div class="dialog-container">
  <h2 mat-dialog-title>Update Opportunity</h2>
 
  <mat-dialog-content>
    <form [formGroup]="angForm" novalidate>
      <mat-form-field appearance="fill">
        <mat-label>Opportunity Text</mat-label>
        <input matInput placeholder="Enter opportunity text" formControlName="opportunity_data" [(ngModel)]="opportunity_data">
        <mat-icon matSuffix>description</mat-icon>
        <mat-error *ngIf="angForm.get('opportunity_data')?.errors?.['required'] && angForm.get('opportunity_data')?.touched">
          Opportunity text required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Opportunity Link</mat-label>
        <input matInput placeholder="Enter opportunity link" formControlName="opportunity_link" [(ngModel)]="opportunity_link">
        <mat-icon matSuffix>link</mat-icon>
      </mat-form-field>

      <div class="file-upload-section">
        <button mat-stroked-button type="button" (click)="fileInput.click()">
          <mat-icon>attach_file</mat-icon>
          Choose File
        </button>
        <input hidden (change)="handleInputChange($event)" #fileInput type="file" accept="image/*">
      </div>

      <div *ngIf="opportunity_image" class="image-preview">
        <img [src]="opportunity_image" class="preview-image">
      </div>

      <mat-form-field appearance="fill">
        <mat-label>Select Circuits</mat-label>
        <mat-select formControlName="circuit_name" [(ngModel)]="circuit_name_arr" multiple>
          <mat-option *ngFor="let circuit of dataSourceCircuit" [value]="circuit.circuit_name">
            {{circuit.circuit_name}}
          </mat-option>
        </mat-select>
        <mat-icon matSuffix>location_on</mat-icon>
        <mat-error *ngIf="angForm.get('circuit_name')?.errors?.['required'] && angForm.get('circuit_name')?.touched">
          Please select at least one circuit
        </mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close color="basic">Cancel</button>
    <button mat-raised-button 
            class="update-btn"
            (click)="updateevent()" 
            [disabled]="!angForm.valid">
        <mat-icon>update</mat-icon>
        Update Opportunity
    </button>
  </mat-dialog-actions>
</div>

<style>
/* .dialog-container {
  padding: 20px;
} */

.file-upload-section {
  margin: 16px 0;
}

.image-preview {
  display: flex;
  justify-content: center;
  margin: 16px 0;
}

.preview-image {
  max-height: 120px;
  max-width: 120px;
  border-radius: 4px;
  object-fit: cover;
}

mat-form-field {
  display: block;
  margin-bottom: 20px;
  width: 100%;
}

::ng-deep .mat-mdc-form-field {
  width: 100%;
}

::ng-deep .mat-mdc-form-field-appearance-fill .mat-mdc-form-field-flex {
  border-radius: 0 !important;
  background-color: #f5f5f5;
}

::ng-deep .mat-mdc-raised-button {
  border-radius: 0 !important;
}

::ng-deep .mat-mdc-button {
  border-radius: 0 !important;
}

.update-btn {
  background-color: #3f51b5 !important;
  color: white !important;
}

.update-btn:disabled {
  background-color: rgba(0, 0, 0, 0.12) !important;
  color: rgba(0, 0, 0, 0.38) !important;
}
</style>
