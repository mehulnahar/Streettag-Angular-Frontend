<div class="dialog-container">
    <h2 mat-dialog-title>Update StreetTag</h2>
    

    <mat-dialog-content>
        <form [formGroup]="angForm" novalidate>
            <mat-form-field appearance="fill">
                <mat-label>Street Name</mat-label>
                <input matInput placeholder="Enter street name" formControlName="street_name">
                <mat-icon matSuffix>place</mat-icon>
                <mat-error *ngIf="angForm.controls['street_name'].errors?.['required']">
                    Street Name is required
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>Start Date</mat-label>
                <input matInput [matDatepicker]="picker1" formControlName="start_date" placeholder="Choose start date">
                <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                <mat-datepicker #picker1></mat-datepicker>
                <mat-error *ngIf="angForm.controls['start_date'].errors?.['required']">
                    Start date is required
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>End Date</mat-label>
                <input matInput [matDatepicker]="picker2" formControlName="end_date" placeholder="Choose end date">
                <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                <mat-datepicker #picker2></mat-datepicker>
                <mat-error *ngIf="angForm.controls['end_date'].errors?.['required']">
                    End date is required
                </mat-error>
            </mat-form-field>
        </form>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button (click)="onNoClick()">Cancel</button>
        <button mat-raised-button 
                color="primary" 
                (click)="updateevent()" 
                [disabled]="!angForm.valid">
            <mat-icon>update</mat-icon>
            Update StreetTag
        </button>
    </mat-dialog-actions>
</div>
