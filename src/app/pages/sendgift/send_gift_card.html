<div class="dialog-content px-15">
    <div class="dialog-header">Send Gift Card</div>

    <form (ngSubmit)="onSubmit(searchForm.value)" #searchForm="ngForm" class="p-4">
        <input type="hidden" name="device_token" [(ngModel)]="device_token">
        <input type="hidden" name="device_type" [(ngModel)]="device_type">
        <input type="hidden" name="location_id" [(ngModel)]="location_id">
        <input type="hidden" name="circuit_id" [(ngModel)]="circuit_id">
        <input type="hidden" name="team_id" [(ngModel)]="team_id">
        <input type="hidden" name="player_email" [(ngModel)]="player_email">

        <div class="form-group">
            <div class="team-name-label">Team Name</div>
            <mat-form-field appearance="outline" class="w-100">
                <input type="text" 
                       placeholder="Search team name" 
                       [(ngModel)]="team_namet" 
                       name="team_name" 
                       matInput 
                       [formControl]="myControl3" 
                       [matAutocomplete]="auto3">
                <mat-autocomplete #auto3="matAutocomplete">
                    <mat-option *ngFor="let option of filteredOptions3 | async" [value]="option.team_namee">
                        {{option.team_namee}}
                    </mat-option>
                </mat-autocomplete>
            </mat-form-field>
            <div class="not-mandatory">*Not mandatory</div>
        </div>

        <div class="form-group mt-3">
            <div class="player-id-label">Player ID</div>
            <mat-form-field appearance="outline" class="w-100">
                <input type="text" 
                       placeholder="Search player ID" 
                       [(ngModel)]="player_namet" 
                       name="player_id" 
                       matInput 
                       [formControl]="myControl1" 
                       [matAutocomplete]="auto1">
                <mat-autocomplete #auto1="matAutocomplete">
                    <mat-option *ngFor="let option of filteredOptions1 | async" [value]="option.player_idd">
                        {{option.player_idd}}
                    </mat-option>
                </mat-autocomplete>
            </mat-form-field>
        </div>

        <div class="player-info mt-3" *ngIf="player_name">
            <div class="info-row">
                <div class="info-label">Name:</div>
                <div class="info-value">{{player_name | decode}}</div>
            </div>
            <div class="info-row">
                <div class="info-label">Email:</div>
                <div class="info-value">{{player_email | decode}}</div>
            </div>
            <div class="info-row">
                <div class="info-label">Team:</div>
                <div class="info-value">{{player_team | decode}}</div>
            </div>
        </div>

        <div class="form-group mt-3">
            <mat-form-field appearance="outline" class="w-100">
                <mat-select name="gift_id" [(ngModel)]="gift_id" placeholder="Select amount">
                    <mat-option [value]="1">100</mat-option>
                    <mat-option [value]="2">200</mat-option>
                    <mat-option [value]="3">300</mat-option>
                    <mat-option [value]="4">400</mat-option>
                    <mat-option [value]="5">500</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="text-center mt-4">
            <button mat-raised-button color="primary" type="submit" class="send-bonus-btn">
                Send Bonus Points
            </button>
        </div>
    </form>
</div>
