<div class="modal-container">
  <div class="modal-content">
    <h3 style="margin-left: 40%">Add School</h3>

    <form [formGroup]="angForm" novalidate>
      <div class="form-group">
        <mat-form-field class="w-100">
          <mat-select placeholder="School Leaderboard" formControlName="circuit_name" required>
            <mat-option *ngFor="let school of dataSourceSchools" [value]="school.id">
              {{school.circuit_name}}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="angForm.controls['circuit_name'].errors?.['required']">School leaderboard is required</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100">
          <input matInput placeholder="School Name" formControlName="team_name" required>
          <mat-error *ngIf="angForm.controls['team_name'].errors?.['required']">School name is required</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100">
          <input matInput placeholder="Full Name" formControlName="fullname" required>
          <mat-error *ngIf="angForm.controls['fullname'].errors?.['required']">Full name is required</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100">
          <input matInput placeholder="User Name" formControlName="player_id" required>
          <mat-error *ngIf="angForm.controls['player_id'].errors?.['required']">User name is required</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100">
          <input matInput type="email" placeholder="Email" formControlName="email" required>
          <mat-error *ngIf="angForm.controls['email'].errors?.['required']">Email is required</mat-error>
          <mat-error *ngIf="angForm.controls['email'].errors?.['email']">Please enter a valid email</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100">
          <input matInput placeholder="Postal Code (optional)" formControlName="postal_code">
        </mat-form-field>
      </div>

      <div class="form-group gender-group">
        <label class="gender-label">Gender:</label>
        <mat-radio-group formControlName="gender" required>
          <mat-radio-button value="male">Male</mat-radio-button>
          <mat-radio-button value="female">Female</mat-radio-button>
          <mat-radio-button value="other">Other</mat-radio-button>
        </mat-radio-group>
        <mat-error *ngIf="angForm.controls['gender'].errors?.['required'] && angForm.controls['gender'].touched">
          Gender is required
        </mat-error>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100">
          <input matInput [matDatepicker]="picker" placeholder="Date of Birth (optional)" formControlName="date_of_birth">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="form-group text-center mt-4">
        <button mat-raised-button color="primary" [disabled]="!angForm.valid || spinner" (click)="addevent()">
          <mat-spinner *ngIf="spinner" diameter="20" class="inline-spinner"></mat-spinner>
          Add School
        </button>
        <button mat-raised-button color="warn" class="ml-2" (click)="onNoClick()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<style>
  .modal-container {
    max-height: 90vh;
    width: 475px;
    overflow-y: auto;
    padding: 20px;
  }

  .modal-content {
    min-height: min-content;
  }

  .w-100 {
    width: 100%;
  }

  .ml-2 {
    margin-left: 1rem;
  }

  .mt-4 {
    margin-top: 2rem;
  }

  .text-center {
    text-align: center;
  }

  .inline-spinner {
    display: inline-block;
    margin-right: 8px;
  }

  .form-group {
    margin-bottom: 1rem;
  }

  .gender-group {
    margin: 1rem 0;
  }

  .gender-label {
    display: block;
    margin-bottom: 0.5rem;
    color: rgba(0, 0, 0, 0.6);
  }

  mat-radio-group {
    display: flex;
    gap: 1rem;
  }

  /* Custom scrollbar styles */
  .modal-container::-webkit-scrollbar {
    width: 8px;
  }

  .modal-container::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 4px;
  }

  .modal-container::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 4px;
  }

  .modal-container::-webkit-scrollbar-thumb:hover {
    background: #555;
  }
</style>
