<div class="charity-add-dialog">
    <div class="dialog-content">
        <h2 mat-dialog-title class="dialog-title">Add Charity</h2>
        
        <mat-dialog-content>
            <form [formGroup]="angForm" novalidate class="charity-form">
                <mat-form-field appearance="fill" class="w-100">
                    <mat-label>Title</mat-label>
                    <input matInput placeholder="Enter charity title" formControlName="title">
                    <mat-error *ngIf="angForm.get('title')?.errors?.['required']">
                        Please enter title
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="fill" class="w-100">
                    <mat-label>Description</mat-label>
                    <textarea matInput formControlName="description" rows="4" 
                        placeholder="Enter charity description"></textarea>
                    <mat-error *ngIf="angForm.get('description')?.errors?.['required']">
                        Description is required
                    </mat-error>
                </mat-form-field>

                <div class="match-fund-section">
                    <label class="match-fund-label">Match Fund</label>
                    <mat-radio-group [(ngModel)]="Fund" [ngModelOptions]="{standalone: true}" class="match-fund-options">
                        <mat-radio-button color="primary" value="1">Yes</mat-radio-button>
                        <mat-radio-button color="primary" value="0">No</mat-radio-button>
                    </mat-radio-group>
                </div>

                <div class="image-upload-section">
                    <label class="upload-label">Charity Image</label>
                    <div class="file-upload-wrapper">
                        <button type="button" class="upload-btn" (click)="fileInput.click()">
                            <mat-icon>cloud_upload</mat-icon>
                            Choose File
                        </button>
                        <span class="file-name" *ngIf="selectedFileName">{{selectedFileName}}</span>
                        <span class="file-name" *ngIf="!selectedFileName">No file chosen</span>
                        <input #fileInput type="file" class="file-input" formControlName="requiredfile" 
                            (change)="handleInputChange($event)"
                            accept="image/gif,image/jpeg,image/png,image/jpg">
                    </div>
                    <mat-error *ngIf="angForm.get('requiredfile')?.errors?.['required']" class="file-error">
                        Please select an image
                    </mat-error>
                </div>
            </form>
        </mat-dialog-content>

        <mat-dialog-actions align="end">
            <button mat-button mat-dialog-close>Cancel</button>
            <button mat-raised-button color="primary" 
                [disabled]="!angForm.valid || clicked"
                (click)="addCharityData()">
                Add Charity
            </button>
        </mat-dialog-actions>
    </div>
</div>

<style>
.charity-add-dialog {
    min-width: 400px;
    max-width: 600px;
    width: 85vw;
}

.dialog-content {
    padding: 16px;
}

.dialog-title {
    margin: 0 0 16px 0;
    color: #1976d2;
    font-weight: 500;
    font-size: 20px;
}

.charity-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.match-fund-section {
    margin: 4px 0;
}

.match-fund-label {
    margin-bottom: 8px;
    font-size: 13px;
}

.match-fund-options {
    display: flex;
    gap: 16px;
}

.image-upload-section {
    margin: 12px 0;
}

.upload-label {
    margin-bottom: 8px;
    font-size: 13px;
}

.file-error {
    color: #f44336;
    font-size: 12px;
    margin-top: 4px;
}

.file-upload-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
}

.file-input {
    display: none;
}

.upload-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background-color: #1976d2;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.3s;
}

.upload-btn:hover {
    background-color: #1565c0;
}

.upload-btn mat-icon {
    font-size: 20px;
    height: 20px;
    width: 20px;
}

.file-name {
    color: #666;
    font-size: 14px;
}

mat-form-field {
    width: 100%;
}

mat-dialog-actions {
    margin: 16px -16px -16px;
    padding: 12px 16px;
    border-top: 1px solid #ddd;
}

::ng-deep .mat-radio-button.mat-accent .mat-radio-ripple .mat-ripple-element {
    background-color: #1976d2 !important;
}

::ng-deep .mat-radio-button.mat-accent .mat-radio-inner-circle {
    background-color: #1976d2 !important;
}

::ng-deep .mat-radio-button.mat-accent.mat-radio-checked .mat-radio-outer-circle {
    border-color: #1976d2 !important;
}
</style>
