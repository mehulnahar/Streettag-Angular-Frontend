<div class="p-4" style="width:100%; height:310px;" perfectScrollbar>
    <div style="width:100%;height:310px;">
        <div style="width:90%; margin: 0 auto;">
            <h3 class="mb-4">Add Charity</h3>
            <div style="width:100%;">
                <form [formGroup]="angForm" novalidate style="display: flex; flex-direction: column; width: 100%;">
                    <mat-form-field style="width:100% !important;" class="w-100">
                        <input matInput placeholder="Title" formControlName="title">
                    </mat-form-field>

                    <div style="width: 100%;" *ngIf="angForm.get('title')?.invalid && (angForm.get('title')?.dirty || angForm.get('title')?.touched)"
                        class="alert alert-danger">
                        <div *ngIf="angForm.get('title')?.errors?.['required']">
                            Please Enter Title
                        </div>
                    </div>

                    <mat-form-field style="width:100% !important;" class="w-100">
                        <mat-label>Description</mat-label>
                        <textarea matInput formControlName="description" rows="3"></textarea>
                    </mat-form-field>

                    <div style="width: 100%;" *ngIf="angForm.get('description')?.invalid && (angForm.get('description')?.dirty || angForm.get('description')?.touched)"
                        class="alert alert-danger">
                        <div *ngIf="angForm.get('description')?.invalid">
                            Description is required.
                        </div>
                    </div>

                    <div class="my-3" style="width:100%;">
                        <label class="mb-2">Match Fund: </label>
                        <mat-radio-group [(ngModel)]="Fund" [ngModelOptions]="{standalone: true}" class="ml-3" style="display: inline-flex;">
                            <mat-radio-button style="margin-right: 20px; margin-left: 10px;" value="1">Yes</mat-radio-button>
                            <mat-radio-button value="0">No</mat-radio-button>
                        </mat-radio-group>
                    </div>

                    <div class="my-3" style="width:100%; margin-top: 10px !important;">
                        <label class="mb-2 d-block">Charity Image:</label>
                        <input formControlName="requiredfile" type="file" (change)="handleInputChange($event)"
                            accept="image/gif,image/jpeg,image/png,image/jpg" style="width:100% !important;">
                    </div>

                    <div style="width: 100%;" *ngIf="angForm.get('requiredfile')?.invalid && (angForm.get('requiredfile')?.dirty || angForm.get('requiredfile')?.touched)"
                        class="alert alert-danger">
                        <div *ngIf="angForm.get('requiredfile')?.errors?.['required']">
                            Please Select Image
                        </div>
                    </div>

                    <div class="text-center mt-4" style="width:100%;">
                        <button mat-raised-button color="primary" 
                            [disabled]="!angForm.valid || clicked"
                            (click)="addCharityData()"
                            style="min-width: 120px; border-radius: 20px; margin-top: 19px !important;">
                            Add Charity
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
