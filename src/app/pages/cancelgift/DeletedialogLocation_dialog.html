<h2 mat-dialog-title>Confirm Delete</h2>
<mat-dialog-content>
  Are you sure you want to delete this gift card?
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button [mat-dialog-close]="'0'">No</button>
  <button mat-button [mat-dialog-close]="'1'" color="warn" (click)="Submit(1)">Yes</button>
</mat-dialog-actions>
