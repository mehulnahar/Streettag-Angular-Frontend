<app-content-header
  [title]="'Avg Leaderboard'"
  [icon]="'leaderboard'"
  [hideBreadcrumb]="true"
  [hasBgImage]="true"
  [class]="'pb-4 pt-4 text-center'"
></app-content-header>

<div class="main-container">
  <form (ngSubmit)="onSubmit(searchForm.value)" #searchForm="ngForm" class="search-form">
    <select
      class="form-select"
      name="location_name"
      [(ngModel)]="location_name"
      (ngModelChange)="get_location_id($event)"
    >
      <option value="">World</option>
      <option *ngFor="let location of dataSourceLocation" [value]="location.id">
        {{ location.location_name }}
      </option>
    </select>

    <select
      class="form-select"
      name="circuit_name"
      [(ngModel)]="circuit_id"
      ngModel
    >
      <option value="">World</option>
      <option *ngFor="let circuit of dataSourceCircuit" [value]="circuit.id">
        {{ circuit.circuit_name }}
      </option>
    </select>

    <button mat-raised-button color="primary" type="submit">
      <mat-icon>search</mat-icon>
      <span>SUBMIT</span>
    </button>
  </form>

  <div align="center" *ngIf="spinner">
    <mat-spinner></mat-spinner>
  </div>

  <div class="container">
    <div class="headered">
      <div class="rank-header">Rank</div>
      <div class="team-header">Team</div>
      <div class="score-header">Average/Score</div>
    </div>

    <div class="card" *ngFor="let entry of leaderboardData" [ngClass]="getCardColor(entry.rank)">
      <div class="rank">
        <span class="trophy" *ngIf="entry.rank <= 3">
          <i class="fa-regular fa-trophy"></i>
          <span class="trophy-number">{{entry.rank}}</span>
        </span>
        <span *ngIf="entry.rank > 3">{{entry.rank}}</span>
      </div>
      <div class="team-info">
        <div class="team-name">{{entry.teamName}}</div>
        <div class="player-count">{{entry.playerCount}} players</div>
      </div>
      <div class="score">
        <div class="score-top">{{entry.averageScore | number}}</div>
        <div class="score-bottom">{{entry.totalScore | number}}</div>
      </div>
    </div>
  </div>
</div>
