<app-content-header [title]="'User Report'" [icon]="'library_books'" [hideBreadcrumb]="true" [hasBgImage]="true"
	[class]="'pb-4 pt-4'"></app-content-header>

<div class="container">
	<mat-card class="mb-4">
		<mat-card-content>
			<div class="row">
				<div class="col-md-6">
					<mat-form-field appearance="outline" class="w-100">
						<mat-label>Team Name</mat-label>
						<input type="text" matInput [formControl]="myControl3" [matAutocomplete]="auto3" (focus)="onFocus('team')">
						<mat-icon matSuffix>group</mat-icon>
						<mat-autocomplete #auto3="matAutocomplete">
							<cdk-virtual-scroll-viewport itemSize="48" class="virtual-scroll-viewport">
								<mat-option *cdkVirtualFor="let option of filteredOptions3 | async; trackBy: trackByTeam" [value]="option.team_namee">
									{{option.team_namee}}
								</mat-option>
							</cdk-virtual-scroll-viewport>
						</mat-autocomplete>
						<mat-hint>Not mandatory</mat-hint>
					</mat-form-field>
				</div>

				<div class="col-md-6">
					<mat-form-field appearance="outline" class="w-100">
						<mat-label>Player ID</mat-label>
						<input type="text" matInput [formControl]="myControl1" [matAutocomplete]="is_all ? auto1 : auto2" (focus)="onFocus('player')">
						<mat-icon matSuffix>person</mat-icon>
						<mat-autocomplete #auto1="matAutocomplete">
							<cdk-virtual-scroll-viewport itemSize="48" class="virtual-scroll-viewport">
								<mat-option *cdkVirtualFor="let option of filteredOptions1 | async; trackBy: trackByPlayer" [value]="option.player_idd">
									{{option.player_idd}}
								</mat-option>
							</cdk-virtual-scroll-viewport>
						</mat-autocomplete>
						<mat-autocomplete #auto2="matAutocomplete">
							<cdk-virtual-scroll-viewport itemSize="48" class="virtual-scroll-viewport">
								<mat-option *cdkVirtualFor="let option of filteredOptions1 | async; trackBy: trackByPlayer" [value]="option.player_idd">
									{{option.player_idd}}
								</mat-option>
							</cdk-virtual-scroll-viewport>
						</mat-autocomplete>
					</mat-form-field>
				</div>
			</div>

			<div class="player-details mt-4" *ngIf="player_name || player_email || player_points || player_team">
				<h2 class="mat-h2 mb-4">Player Details</h2>
				<mat-divider class="mb-4"></mat-divider>
				
				<div class="row">
					<div class="col-md-3 mb-3">
						<mat-card class="h-100 player-info-card">
							<mat-card-content>
								<div class="text-muted mb-2">Name</div>
								<div class="player-value">{{player_name | decode}}</div>
							</mat-card-content>
						</mat-card>
					</div>
					
					<div class="col-md-3 mb-3">
						<mat-card class="h-100 player-info-card">
							<mat-card-content>
								<div class="text-muted mb-2">Email</div>
								<div class="player-value">{{player_email | decode}}</div>
							</mat-card-content>
						</mat-card>
					</div>
					
					<div class="col-md-3 mb-3">
						<mat-card class="h-100 player-info-card">
							<mat-card-content>
								<div class="text-muted mb-2">Score Points</div>
								<div class="player-value">{{player_points}}</div>
							</mat-card-content>
						</mat-card>
					</div>
					
					<div class="col-md-3 mb-3">
						<mat-card class="h-100 player-info-card">
							<mat-card-content>
								<div class="text-muted mb-2">Team</div>
								<div class="player-value">{{player_team | decode}}</div>
							</mat-card-content>
						</mat-card>
					</div>
				</div>

				<div class="row mt-4 button-group">
					<div class="col-md-4 mb-3">
						<button mat-raised-button color="primary" class="w-100" (click)="getPlayerTagsDetails()" [disabled]="isVailid">
							<mat-icon>local_offer</mat-icon>
							<span class="ml-2">Download Tags Report</span>
						</button>
					</div>

					<div class="col-md-4 mb-3">
						<button mat-raised-button color="primary" class="w-100" (click)="getPlayerStepsDetails()" [disabled]="isVailid">
							<mat-icon>directions_walk</mat-icon>
							<span class="ml-2">Download Steps Report</span>
						</button>
					</div>

					<div class="col-md-4 mb-3">
						<button mat-raised-button color="primary" class="w-100" (click)="getPlayerPecodesDetails()" [disabled]="isVailid">
							<mat-icon>qr_code</mat-icon>
							<span class="ml-2">Download Pecode Report</span>
						</button>
					</div>
				</div>

				<div class="text-center mt-3" *ngIf="spinner">
					<mat-progress-spinner diameter="30" mode="indeterminate"></mat-progress-spinner>
				</div>
			</div>
		</mat-card-content>
	</mat-card>
</div>
