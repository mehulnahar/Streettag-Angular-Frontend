<h3 style="text-align: center;">Edit Emails</h3>
<form [formGroup]="angForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content class="mat-typography">    
        <div class="row">
            <div class="col-md-12">
                <mat-form-field class="w-100">
                    <mat-label>Selected Location</mat-label>
                    <input matInput [value]="selectedLocation" disabled>
                    <mat-hint align="start"><strong>Disabled Field</strong></mat-hint>
                </mat-form-field>
            </div>
            
            <div class="col-md-12 mt-3">
                <mat-form-field class="w-100">
                    <mat-label>Selected Circuit</mat-label>
                    <input matInput [value]="selectedCircuit" disabled>
                    <mat-hint align="start"><strong>Disabled Field</strong></mat-hint>
                </mat-form-field>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-12">
                <mat-form-field class="w-100" appearance="outline">
                    <mat-label>Add Emails</mat-label>
                    <mat-chip-grid #chipGrid>
                        <mat-chip-row *ngFor="let email of emailArray" 
                            [removable]="removable"
                            (removed)="remove(email)">
                            {{email}}
                            <mat-icon matChipRemove *ngIf="removable">cancel</mat-icon>
                        </mat-chip-row>
                        <input placeholder="Add more emails..."
                            [matChipInputFor]="chipGrid"
                            [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                            [matChipInputAddOnBlur]="addOnBlur"
                            (matChipInputTokenEnd)="add($event)">
                    </mat-chip-grid>
                    <mat-hint>You can enter multiple emails</mat-hint>
                </mat-form-field>
            </div>
        </div>
    </div>

    <div mat-dialog-actions align="end">
        <button mat-button type="button" (click)="close()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="emailArray.length === 0">
            Submit
        </button>
    </div>
</form>
