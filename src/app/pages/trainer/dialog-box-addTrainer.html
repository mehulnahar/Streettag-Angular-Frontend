<div class="dialog-content p-3" style="min-width: 400px;">
    <h3 class="mb-3">Add Trainer</h3>

    <form [formGroup]="angForm" novalidate>
        <div class="form-content">
            <mat-form-field appearance="outline" class="w-100 mb-2">
                <mat-label>Name</mat-label>
                <input matInput placeholder="Enter name" [(ngModel)]="name" name="name"
                    formControlName="name">
                <mat-error *ngIf="angForm.controls['name'].errors?.['required']">
                    Trainer Name is required
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100 mb-2">
                <mat-label>Email</mat-label>
                <input matInput placeholder="Enter email" [(ngModel)]="email" name="email"
                    formControlName="email">
                <mat-error *ngIf="angForm.controls['email'].invalid">
                    Invalid Email address
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Phone</mat-label>
                <input matInput placeholder="Enter phone" [(ngModel)]="phone" name="phone"
                    formControlName="phone">
                <mat-error *ngIf="angForm.controls['phone'].invalid">
                    Invalid Phone number
                </mat-error>
            </mat-form-field>

            <div class="text-center mt-2">
                <button mat-raised-button color="primary" class="px-5" 
                    [disabled]="clicked || angForm.invalid" 
                    (click)="addTrainer()">
                    Add Trainer
                </button>
            </div>
        </div>
    </form>
</div>
