<div class="fruit-dialog">
    <h2 mat-dialog-title>{{data.fruit ? 'Edit' : 'Add'}} Fruit Details</h2>
    <form [formGroup]="angForm" (ngSubmit)="addevent()" novalidate>
        <mat-dialog-content>
            <div class="row">
                <div class="col-12 mb-3">
                    <mat-form-field class="w-100">
                        <mat-label>Fruit Name</mat-label>
                        <input matInput formControlName="name" [placeholder]="data.fruit?.name || 'Enter fruit name'">
                        <mat-error *ngIf="angForm.get('name')?.hasError('required')">
                            Fruit name is required
                        </mat-error>
                    </mat-form-field>
                </div>
                <div class="col-12 mb-3">
                    <mat-form-field class="w-100">
                        <mat-label>Description</mat-label>
                        <textarea matInput formControlName="description" rows="3" 
                            [placeholder]="data.fruit?.description || 'Enter fruit description'"></textarea>
                        <mat-error *ngIf="angForm.get('description')?.hasError('required')">
                            Description is required
                        </mat-error>
                    </mat-form-field>
                </div>
                <div class="col-md-6 mb-3">
                    <mat-form-field class="w-100">
                        <mat-label>Price ($)</mat-label>
                        <input matInput type="number" formControlName="price" 
                            [placeholder]="data.fruit?.price || 'Enter price'">
                        <mat-error *ngIf="angForm.get('price')?.hasError('required')">
                            Price is required
                        </mat-error>
                    </mat-form-field>
                </div>
                <div class="col-md-6 mb-3">
                    <mat-form-field class="w-100">
                        <mat-label>Quantity</mat-label>
                        <input matInput type="number" formControlName="quantity" 
                            [placeholder]="data.fruit?.quantity || 'Enter quantity'">
                        <mat-error *ngIf="angForm.get('quantity')?.hasError('required')">
                            Quantity is required
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions align="end">
            <button mat-button type="button" (click)="onNoClick()">Cancel</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="!angForm.valid">
                {{data.fruit ? 'Update' : 'Add'}} Fruit
            </button>
        </mat-dialog-actions>
    </form>
</div>
