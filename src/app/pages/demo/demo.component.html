<div class="content-header">
    <h2><mat-icon>qr_code</mat-icon> Fruit Card QR</h2>
    <button mat-raised-button color="primary" class="generate-btn" (click)="generateQR()">
        Generate QR
    </button>
</div>

<div class="container-fluid mt-3">
    <mat-card>
        <mat-card-content>
            <!-- Search Filter -->
            <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Filter</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Type to filter...">
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>

            <!-- Table -->
            <div class="mat-elevation-z8">
                <table mat-table [dataSource]="dataSource" matSort class="w-100">
                    
                    <!-- S No Column -->
                    <ng-container matColumnDef="serial_number">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> S No. </th>
                        <td mat-cell *matCellDef="let row; let i = index"> {{i + 1}} </td>
                    </ng-container>

                    <!-- Card Name Column -->
                    <ng-container matColumnDef="card_name">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Card Name </th>
                        <td mat-cell *matCellDef="let row"> {{row.card_name}} </td>
                    </ng-container>

                    <!-- Fruit Column -->
                    <ng-container matColumnDef="fruit">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Fruit </th>
                        <td mat-cell *matCellDef="let row"> {{row.fruit_name}} </td>
                    </ng-container>

                    <!-- Score Points Column -->
                    <ng-container matColumnDef="score_points">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Score Points </th>
                        <td mat-cell *matCellDef="let row"> {{row.score}} </td>
                    </ng-container>

                    <!-- QR Image Column -->
                    <ng-container matColumnDef="qr_code_path">
                        <th mat-header-cell *matHeaderCellDef>QR Image</th>
                        <td mat-cell *matCellDef="let row">
                            <img loading="lazy" [src]="row.qr_code_path" style="height:120px; width:120px;" [alt]="row.fruit_name + ' QR Code'">
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>

                <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
            </div>
        </mat-card-content>
    </mat-card>
</div>
