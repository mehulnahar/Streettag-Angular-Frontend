<app-content-header [title]="'Give Bonus Points'" [icon]="'emoji_events'" [hideBreadcrumb]="true" [hasBgImage]="true"
	[class]="'pb-3 pt-3'"></app-content-header>

<div class="container">
	<div class="form-card">
		<form [formGroup]="form" (ngSubmit)="onSubmit(form.value)" class="animated fadeIn">
			<input type="hidden" formControlName="device_token">
			<input type="hidden" formControlName="device_type">
			<input type="hidden" formControlName="location_id">
			<input type="hidden" formControlName="circuit_id">
			<input type="hidden" formControlName="team_id">
			<input type="hidden" formControlName="player_email">

			<div class="form-section">
				<div class="form-group">
					<label class="form-label">Team Name</label>
					<mat-form-field appearance="outline" class="w-100">
						<input type="text" 
							   placeholder="Search team name" 
							   matInput 
							   [formControl]="myControl3" 
							   [matAutocomplete]="auto3">
						<mat-icon matSuffix>search</mat-icon>
						<mat-autocomplete #auto3="matAutocomplete">
							<mat-option *ngFor="let option of filteredOptions3 | async" [value]="option.team_namee">
								{{option.team_namee}}
							</mat-option>
						</mat-autocomplete>
					</mat-form-field>
					<small class="hint-text">*Not mandatory</small>
				</div>

				<div class="form-group">
					<label class="form-label">Player ID</label>
					<mat-form-field appearance="outline" class="w-100">
						<input type="text" 
							   placeholder="Search player ID" 
							   matInput 
							   [formControl]="myControl1" 
							   [matAutocomplete]="auto1">
						<mat-icon matSuffix>person_search</mat-icon>
						<mat-autocomplete #auto1="matAutocomplete" (optionSelected)="get_player_id($event.option.value)">
							<mat-option *ngFor="let option of filteredOptions1 | async" [value]="option.player_idd">
								{{option.player_idd}}
							</mat-option>
						</mat-autocomplete>
					</mat-form-field>
				</div>
			</div>

			<div class="player-info-card">
				<div class="info-row">
					<div class="info-col">
						<div class="info-item">
							<label class="info-label">Name</label>
							<span class="info-value">{{player_name | decode}}</span>
						</div>
					</div>
					<div class="info-col">
						<div class="info-item">
							<label class="info-label">Email</label>
							<span class="info-value">{{player_email | decode}}</span>
						</div>
					</div>
					<div class="info-col">
						<div class="info-item">
							<label class="info-label">Team</label>
							<span class="info-value">{{player_team | decode}}</span>
						</div>
					</div>
				</div>
			</div>

			<div class="form-section">
				<div class="form-group">
					<label class="form-label">Bonus Type</label>
					<mat-form-field appearance="outline" class="w-100">
						<mat-select formControlName="bonus_type">
							<mat-option value="1">Bonus Points</mat-option>
							<mat-option value="2">Steps</mat-option>
						</mat-select>
						<mat-icon matSuffix>stars</mat-icon>
					</mat-form-field>
				</div>

				<div class="form-group">
					<label class="form-label">Points</label>
					<mat-form-field appearance="outline" class="w-100">
						<input matInput 
							   type="text" 
							   formControlName="points" 
							   placeholder="Enter points">
						<mat-icon matSuffix>add_circle</mat-icon>
					</mat-form-field>
				</div>
			</div>

			<div class="action-section">
				<button type="submit" mat-raised-button color="primary" class="submit-btn">
					<mat-icon>send</mat-icon>
					<span>Send</span>
				</button>
			</div>
		</form>
	</div>
</div>
