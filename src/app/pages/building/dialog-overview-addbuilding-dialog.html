<div class="dialog-container">
  <h2 mat-dialog-title>Add Building</h2>
  

  <mat-dialog-content>
    <form [formGroup]="angForm" novalidate>
      <mat-form-field appearance="fill">
        <mat-label>Building Name</mat-label>
        <input matInput placeholder="Enter building name" formControlName="building_name">
        <mat-icon matSuffix>business</mat-icon>
        <mat-error *ngIf="angForm.get('building_name')?.errors?.['required'] && angForm.get('building_name')?.touched">
          Building name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Latitude</mat-label>
        <input type="number" matInput placeholder="Enter latitude" formControlName="lat">
        <mat-icon matSuffix>location_on</mat-icon>
        <mat-error *ngIf="angForm.get('lat')?.errors?.['required'] && angForm.get('lat')?.touched">
          Latitude is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Longitude</mat-label>
        <input type="number" matInput placeholder="Enter longitude" formControlName="lng">
        <mat-icon matSuffix>location_on</mat-icon>
        <mat-error *ngIf="angForm.get('lng')?.errors?.['required'] && angForm.get('lng')?.touched">
          Longitude is required
        </mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close color="basic">Cancel</button>
    <button mat-raised-button 
            class="add-btn"
            (click)="onSubmit()" 
            [disabled]="!angForm.valid">
        <mat-icon>add</mat-icon>
        Add Building
    </button>
  </mat-dialog-actions>
</div>

<style>
/* .dialog-container {
  padding: 20px;
} */

mat-form-field {
  display: block;
  margin-bottom: 20px;
  width: 100%;
}

::ng-deep .mat-mdc-form-field {
  width: 100%;
}

::ng-deep .mat-mdc-form-field-appearance-fill .mat-mdc-form-field-flex {
  border-radius: 0 !important;
  background-color: #f5f5f5;
}

::ng-deep .mat-mdc-raised-button {
  border-radius: 0 !important;
}

::ng-deep .mat-mdc-button {
  border-radius: 0 !important;
}

.add-btn {
  background-color: #3f51b5 !important;
  color: white !important;
}

.add-btn:disabled {
  background-color: rgba(0, 0, 0, 0.12) !important;
  color: rgba(0, 0, 0, 0.38) !important;
}
</style>
