<app-content-header [title]="'Pecode'" [icon]="'qr_code'" [hideBreadcrumb]="true" [hasBgImage]="true"
    [class]="'pt-3'"></app-content-header>

<mat-toolbar color="primary" fxLayout="row" fxLayoutAlign="space-between center">
    <div fxLayout="row" fxLayoutAlign="center center">
        <button mat-raised-button color="accent" (click)="exportAsXLSX()" class="compose" fxShow="false"
            fxShow.gt-xs>Download Excel</button>
    </div>
</mat-toolbar>

<div class="p-2" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="16px">
    <mat-form-field style="width: 200px;">
        <mat-label>Select Trainer</mat-label>
        <mat-select [(ngModel)]="trainerDATA" (selectionChange)="get_trainer_pecode(trainerDATA)">
            <mat-option *ngFor="let trainer of dataSourceTrainer" [value]="trainer">
                {{trainer.trainer_name}}
            </mat-option>
        </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="genrate_pecode()" [disabled]="disable_btn">
        Generate PEcode
    </button>
</div>

<div fxLayout="column" class="p-2">
    <div class="p-2" style="margin-bottom: 30px;">
        <div fxLayout="column" class="mat-elevation-z8">
            <mat-form-field class="px-3 py-1">
                <input matInput (keyup)="applyFilter($any($event.target).value)" placeholder="Type to filter all columns">
            </mat-form-field>
        </div>
        <mat-table #table [dataSource]="dataSource" matSort class="mat-elevation-z8">
            <ng-container matColumnDef="serial_number">
                <mat-header-cell *matHeaderCellDef mat-sort-header>S No.</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.serial_number}}</mat-cell>
            </ng-container>
            <ng-container matColumnDef="trainer_name">
                <mat-header-cell *matHeaderCellDef mat-sort-header>Trainer Name</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.trainer_name}}</mat-cell>
            </ng-container>
            <ng-container matColumnDef="pecode">
                <mat-header-cell *matHeaderCellDef mat-sort-header>PEcode</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.pecode}}</mat-cell>
            </ng-container>
            <ng-container matColumnDef="created_at">
                <mat-header-cell *matHeaderCellDef mat-sort-header>Created At</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.created_at}}</mat-cell>
            </ng-container>
            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
        <mat-paginator #paginator [pageSize]="10" [pageSizeOptions]="[10, 20, 30]"></mat-paginator>
    </div>
</div>
