<mat-toolbar  class="dialog-header">
  <span>Edit Monument Tour</span>
  <button mat-icon-button class="close-button" [mat-dialog-close]="true" style="margin-left: auto">
    <mat-icon>close</mat-icon>
  </button>
</mat-toolbar>

<form [formGroup]="angForm" (ngSubmit)="onSubmit()" class="dialog-form">
  <mat-dialog-content class="dialog-content">
    <div class="form-row">
      <mat-form-field appearance="fill">
        <mat-label>Tour Name</mat-label>
        <input matInput formControlName="tourName" #inputTitle maxlength="50">
        <mat-hint align="end">{{inputTitle.value.length || 0}}/50</mat-hint>
        <mat-error *ngIf="angForm.get('tourName')?.errors?.['required'] && angForm.get('tourName')?.touched">
          Tour name is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="fill">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" #input maxlength="150" cdkTextareaAutosize></textarea>
        <mat-hint align="end">{{input.value.length || 0}}/150</mat-hint>
        <mat-error *ngIf="angForm.get('description')?.errors?.['required'] && angForm.get('description')?.touched">
          Description is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <div class="monument-selection-container">
        <!-- Monument Dropdowns -->
        <div class="monument-dropdowns" formArrayName="location">
          <div *ngFor="let control of location.controls; let i = index" class="monument-dropdown-item">
            <mat-form-field appearance="fill" class="monument-dropdown">
              <mat-label>Select Monument {{i + 1}}</mat-label>
              <mat-select [formControlName]="i" (selectionChange)="onMonumentSelect($event.value, i)">
                <mat-option *ngFor="let monument of Monumentdata" [value]="monument.id" [disabled]="monument.disable">
                  {{monument.name}}
                </mat-option>
              </mat-select>
              <mat-error *ngIf="location.at(i).errors?.['required'] && location.at(i).touched">
                Please select a monument
              </mat-error>
            </mat-form-field>
          </div>
        </div>
        
        <div class="monument-controls">
          <button mat-mini-fab color="primary" type="button" 
                  (click)="addMoreLocation()" 
                  [disabled]="location.length >= 2">
            <mat-icon>add</mat-icon>
          </button>
          <button mat-mini-fab color="warn" type="button" 
                  (click)="RemoveLocation()" 
                  [disabled]="location.length <= 1">
            <mat-icon>remove</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <div class="form-row upload-section">
      <div class="image-upload-container">
        <h3>Tour Image</h3>
        <div class="image-preview" *ngIf="angForm.get('tour_image')?.value">
          <img [src]="angForm.get('tour_image')?.value" alt="Tour preview" style="width: 500px; height: 500px; object-fit: cover;" (click)="OpenImageViewerBox(angForm.get('tour_image')?.value)">
        </div>
        <div class="upload-button">
          <input type="file" #takeInput (change)="handleInputChange($event)" accept="image/jpeg,image/jpg,image/png" style="display: none;">
          <button mat-raised-button color="primary" type="button" (click)="takeInput.click()">
            <mat-icon>cloud_upload</mat-icon>
            Choose Image
          </button>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="(!angForm.valid && !angForm.get('imageChanged')?.value) || isSubmitting">
      <mat-icon>save</mat-icon>
      Save Changes
    </button>
  </mat-dialog-actions>
</form>
