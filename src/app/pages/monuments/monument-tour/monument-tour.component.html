<app-content-header 
  [icon]="'tour'"
  [title]="'Monument Tour'"
  [hideBreadcrumb]="false"
  [hasBgImage]="true" 
  [class]="'pb-4'">
</app-content-header>

<mat-toolbar class="toolbar">
  <button mat-raised-button color="primary" (click)="openAddMessageDialog()">
    <mat-icon>add</mat-icon> Add Tour
  </button>
</mat-toolbar>

<div class="mat-elevation-z8">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Type to filter all columns">
  </mat-form-field>

  <mat-table [dataSource]="dataSource" matSort>
    <!-- Serial Number Column -->
    <ng-container matColumnDef="serial_number">
      <mat-header-cell *matHeaderCellDef> No. </mat-header-cell>
      <mat-cell *matCellDef="let i = index"> {{i + 1}} </mat-cell>
    </ng-container>

    <!-- Tour Name Column -->
    <ng-container matColumnDef="tour_name">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Tour Name </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.tour_name}} </mat-cell>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="discription">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Description </mat-header-cell>
      <mat-cell *matCellDef="let element" class="line-clamp"> {{element.discription}} </mat-cell>
    </ng-container>

    <!-- Latitude Column -->
    <ng-container matColumnDef="lat">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Latitude </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.lat}} </mat-cell>
    </ng-container>

    <!-- Longitude Column -->
    <ng-container matColumnDef="lng">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Longitude </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.lng}} </mat-cell>
    </ng-container>

    <!-- Image Column -->
    <ng-container matColumnDef="tour_image">
      <mat-header-cell *matHeaderCellDef> Image </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <img *ngIf="element.tour_image" [src]="element.tour_image" width="50" height="50" [alt]="element.tour_name">
      </mat-cell>
    </ng-container>

    <!-- Created Date Column -->
    <ng-container matColumnDef="created_at">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Start Date </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.created_at | date}} </mat-cell>
    </ng-container>

    <!-- View Column -->
    <ng-container matColumnDef="view">
      <mat-header-cell *matHeaderCellDef> View </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="openDetailDialog(element)">
          <mat-icon>visibility</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <!-- Edit Column -->
    <ng-container matColumnDef="edit">
      <mat-header-cell *matHeaderCellDef> Edit </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="openEditDialog(element)" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <!-- <button mat-icon-button color="warn" (click)="deleteTour(element.id)" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button> -->
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

    <!-- Row shown when there is no matching data -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="10">No data matching the filter</td>
    </tr>
  </mat-table>

  <mat-paginator 
    [pageSizeOptions]="[5, 10, 25, 100]"
    [pageSize]="10"
    showFirstLastButtons>
  </mat-paginator>
</div>
